<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รูปทั้งหมด | Photo Gallery — House of Happiness Bangkok</title>
<meta name="description" content="รูปห้องพัก ห้องน้ำ และตัวอาคารของ House of Happiness คลองสาน กรุงเทพฯ กว่า 30 รูป | Full photo gallery of our serviced apartments in Khlong San, Bangkok.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:title" content="รูปทั้งหมด — House of Happiness Bangkok">
<meta property="og:description" content="ห้องนอน · ห้องน้ำ · ตัวอาคาร — ชมรูปจริงของที่พักกว่า 30 รูป">
<meta property="og:image" content="https://houseofhappinessbangkok.com/images/bedroom.jpg">
<link rel="canonical" href="https://houseofhappinessbangkok.com/gallery.html">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#f7f1e6">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<style>
/* ── สไตล์เฉพาะหน้านี้ ── */
.gl-hero{padding:4.2rem 1.2rem 2.2rem; text-align:center}
.gl-hero h1{font-family:var(--font-display); font-size:clamp(1.7rem,4.5vw,2.6rem); color:var(--dark); margin-bottom:0.6rem}
.gl-hero p{color:var(--muted); max-width:44em; margin:0 auto; line-height:1.7}
.gl-wrap{max-width:1080px; margin:0 auto; padding:0 1.2rem 3.5rem}
.gl-group{margin:2.2rem 0 1rem; display:flex; align-items:center; gap:0.7rem}
.gl-group h2{font-family:"Prompt",sans-serif; font-size:1.05rem; color:var(--gold-dark); white-space:nowrap}
.gl-group::after{content:""; flex:1; height:1px; background:var(--line)}
.gl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem}
.gl-grid figure{
  margin:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; box-shadow:0 4px 16px rgba(62,47,35,0.06); cursor:zoom-in;
  transition:transform .18s ease, box-shadow .18s ease;
}
.gl-grid figure:hover{transform:translateY(-3px); box-shadow:0 12px 26px rgba(62,47,35,0.12)}
.gl-grid img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.gl-grid figcaption{padding:0.6rem 0.8rem 0.75rem; font-size:0.82rem; color:var(--text); line-height:1.5}
.gl-cta{text-align:center; margin-top:2.6rem}
/* ── ไลต์บ็อกซ์ดูรูปใหญ่ ── */
.lb{position:fixed; inset:0; background:rgba(30,23,16,0.92); display:none; z-index:200;
  align-items:center; justify-content:center; flex-direction:column; padding:1rem}
.lb.open{display:flex}
.lb img{max-width:min(96vw,1000px); max-height:80vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.lb .cap{color:#f3ead9; font-size:0.9rem; margin-top:0.8rem; text-align:center}
.lb button{position:absolute; background:rgba(255,255,255,0.12); color:#fff; border:0; border-radius:50%;
  width:44px; height:44px; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center}
.lb button:hover{background:rgba(255,255,255,0.25)}
.lb .x{top:14px; right:14px}
.lb .prev{left:10px; top:50%; transform:translateY(-50%)}
.lb .next{right:10px; top:50%; transform:translateY(-50%)}
</style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html"><span class="logo">🏠</span> House of Happiness</a>
  <div class="navlinks">
    <a href="index.html" data-i18n="bk.back">← กลับหน้าหลัก</a>
  </div>
  <div class="nav-right">
    <div class="lang-toggle">
      <button data-lang="th" onclick="setLang('th')">ไทย</button>
      <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <a class="btn btn-gold btn-sm" href="booking.html" data-i18n="nav.book">จองเลย</a>
  </div>
</nav>

<header class="gl-hero">
  <h1 id="glTitle">รูปทั้งหมดของที่พัก</h1>
  <p id="glSub">ห้องพักทุกแบบ ห้องน้ำ และตัวอาคาร — รูปถ่ายจริงจากที่พักของเรา</p>
</header>

<div class="gl-wrap" id="glWrap"></div>

<div class="gl-cta">
  <a class="btn btn-gold" href="booking.html" data-i18n="cta.direct">จองตรงกับเรา</a>
</div>
<div style="height:2.5rem"></div>

<!-- ไลต์บ็อกซ์ -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbX" aria-label="ปิด">✕</button>
  <button class="prev" id="lbPrev" aria-label="รูปก่อนหน้า">‹</button>
  <img id="lbImg" src="" alt="">
  <div class="cap" id="lbCap"></div>
  <button class="next" id="lbNext" aria-label="รูปถัดไป">›</button>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/ui.js"></script>
<script>
// รูปทั้งหมด จัดตามหมวด — คำบรรยายไทย/อังกฤษอยู่ในหน้านี้เลย (ไม่ต้องเพิ่มคีย์ i18n กลาง)
var GROUPS = [
  { th: "ห้องนอน", en: "Bedrooms", items: [
    { f: "images/bedroom.jpg",          th: "ห้อง Standard — เตียงใหญ่ พร้อมระเบียง", en: "Standard room — double bed with balcony" },
    { f: "images/gallery/bedroom2.jpg", th: "ห้องนอนเตียงใหญ่ พร้อมโซฟาและทีวี", en: "Double bedroom with sofa and TV" },
    { f: "images/gallery/bedroom3.jpg", th: "ห้องนอนเตียงใหญ่ พร้อมโต๊ะทำงาน", en: "Double bedroom with work desk" },
    { f: "images/gallery/bedroom4.jpg", th: "ห้องนอนพร้อมทีวีติดผนัง", en: "Bedroom with wall-mounted TV" },
    { f: "images/gallery/bedroom5.jpg", th: "ห้องนอนโทนขาวเรียบง่าย", en: "Bedroom in minimal white tones" },
    { f: "images/gallery/bedroom6.jpg", th: "ห้องนอนริมหน้าต่างบานใหญ่", en: "Bedroom by a large window" },
    { f: "images/gallery/bedroom7.jpg", th: "ห้องนอนพร้อมราวแขวนเสื้อและทางออกระเบียง", en: "Bedroom with clothes rack and balcony access" },
    { f: "images/gallery/bedroom8.jpg", th: "ห้องนอนพร้อมโต๊ะทำงานและภาพประดับ", en: "Bedroom with desk and framed art" },
    { f: "images/gallery/bedroom9.jpg", th: "เตียงใหญ่ผ้าปูขาว พร้อมผ้าขนหนู", en: "King bed with fresh white linens" },
    { f: "images/twin.jpg",             th: "ห้อง Studio — 2 เตียงแยก", en: "Studio room — twin beds" },
    { f: "images/gallery/twin2.jpg",    th: "ห้องเตียงคู่ พร้อมทีวีติดผนัง", en: "Twin room with wall-mounted TV" },
    { f: "images/gallery/twin3.jpg",    th: "ห้องเตียงคู่ อีกมุมหนึ่ง", en: "Twin room from another angle" }
  ]},
  { th: "ห้องนั่งเล่น", en: "Living room", items: [
    { f: "images/living.jpg", th: "ห้องนั่งเล่นในห้องพัก", en: "Living area" },
    { f: "images/deluxe.jpg", th: "ห้องนั่งเล่นแยกของห้อง Deluxe", en: "Separate living room of the Deluxe apartment" }
  ]},
  { th: "ห้องน้ำ", en: "Bathrooms", items: [
    { f: "images/bathroom.jpg",      th: "ห้องน้ำในห้องพัก", en: "En-suite bathroom" },
    { f: "images/gallery/bath2.jpg", th: "ห้องน้ำโทนขาวดำ พร้อมอ่างล้างหน้าและกระจก", en: "Black-and-white bathroom with basin and mirror" },
    { f: "images/gallery/bath3.jpg", th: "ห้องน้ำพร้อมฉากกั้นอาบน้ำ", en: "Bathroom with glass shower partition" },
    { f: "images/gallery/shower.jpg", th: "มุมอาบน้ำพร้อมเครื่องทำน้ำอุ่น", en: "Shower area with water heater" },
    { f: "images/gallery/bath4.jpg", th: "ห้องน้ำกระเบื้องโมเสกขาวดำ", en: "Mosaic-tiled bathroom" },
    { f: "images/gallery/bath5.jpg", th: "อ่างล้างหน้า กระจก และฝักบัว", en: "Basin, mirror and shower" },
    { f: "images/gallery/bath6.jpg", th: "ห้องน้ำโมเสก อีกมุมหนึ่ง", en: "Mosaic bathroom from another angle" }
  ]},
  { th: "ภายในอาคารและบริการ", en: "Inside the building & facilities", items: [
    { f: "images/reception.jpg",       th: "จุดต้อนรับ / เช็คอิน", en: "Reception / check-in" },
    { f: "images/entrance.jpg",        th: "ทางเข้าที่พัก", en: "The entrance" },
    { f: "images/gallery/hallway.jpg", th: "โถงทางเดินและบันไดภายในอาคาร", en: "Interior hallway and staircase" },
    { f: "images/gallery/lounge.jpg",  th: "มุมนั่งเล่นหน้าห้องพัก", en: "Seating corner in the hallway" },
    { f: "images/gallery/laundry.jpg", th: "เครื่องซักผ้าหยอดเหรียญ (เหรียญ 10 บาท)", en: "Coin-operated washing machine (10-baht coins)" },
    { f: "images/gallery/keybox.jpg",  th: "กล่องคืนกุญแจ สำหรับเช็คเอาท์เช้าตรู่", en: "Key drop box for early check-out" }
  ]},
  { th: "ตัวอาคารและรอบบ้าน", en: "Building & surroundings", items: [
    { f: "images/building.jpg",       th: "ตัวอาคารที่พัก", en: "The building" },
    { f: "images/gallery/facade.jpg", th: "ด้านหน้าอาคาร (ป้ายบ้านมั่งมีทวีสุข)", en: "Building facade with the house-name sign" },
    { f: "images/gallery/spirit.jpg", th: "ทางเข้าพร้อมศาลพระภูมิ", en: "Entrance with the spirit house" },
    { f: "images/balcony.jpg",        th: "วิวจากระเบียงส่วนตัว", en: "View from a private balcony" }
  ]}
];

var FLAT = [];
GROUPS.forEach(function (g) { g.items.forEach(function (it) { FLAT.push(it); }); });

function render() {
  var lang = getLang();
  document.getElementById("glTitle").textContent = lang === "en" ? "All Photos" : "รูปทั้งหมดของที่พัก";
  document.getElementById("glSub").textContent = lang === "en"
    ? "Every room type, bathrooms and the building — real photos taken at our place."
    : "ห้องพักทุกแบบ ห้องน้ำ และตัวอาคาร — รูปถ่ายจริงจากที่พักของเรา";
  var idx = 0;
  document.getElementById("glWrap").innerHTML = GROUPS.map(function (g) {
    var cards = g.items.map(function (it) {
      var i = idx++;
      return '<figure data-idx="' + i + '"><img src="' + it.f + '" alt="' + it.en + '" loading="lazy" onerror="this.parentElement.remove()">' +
        '<figcaption>' + (lang === "en" ? it.en : it.th) + '</figcaption></figure>';
    }).join("");
    return '<div class="gl-group"><h2>' + (lang === "en" ? g.en : g.th) + '</h2></div><div class="gl-grid">' + cards + '</div>';
  }).join("");
}
render();
document.addEventListener("langchange", render);

// ไลต์บ็อกซ์: คลิกรูป → ดูใหญ่ เลื่อนซ้ายขวาได้
var cur = 0;
var lb = document.getElementById("lb");
function show(i) {
  cur = (i + FLAT.length) % FLAT.length;
  document.getElementById("lbImg").src = FLAT[cur].f;
  document.getElementById("lbCap").textContent = getLang() === "en" ? FLAT[cur].en : FLAT[cur].th;
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
}
function hide() { lb.classList.remove("open"); document.body.style.overflow = ""; }
document.getElementById("glWrap").addEventListener("click", function (e) {
  var fig = e.target.closest("figure[data-idx]");
  if (fig) show(Number(fig.dataset.idx));
});
document.getElementById("lbX").addEventListener("click", hide);
document.getElementById("lbPrev").addEventListener("click", function () { show(cur - 1); });
document.getElementById("lbNext").addEventListener("click", function () { show(cur + 1); });
lb.addEventListener("click", function (e) { if (e.target === lb) hide(); });
document.addEventListener("keydown", function (e) {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") hide();
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "ArrowRight") show(cur + 1);
});
</script>

</body>
</html>
