name: Production smoke test

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage and dependencies
        shell: bash
        run: |
          set -euo pipefail
          base="https://houseofhappinessbangkok.com"
          curl --fail --silent --show-error "$base/" > /dev/null
          curl --fail --silent --show-error "$base/booking.html" > /dev/null
          health="$(curl --fail --silent --show-error "$base/api/health")"
          echo "$health" | jq -e '.ok == true'

          checkin="$(date -u -d '+2 days' +%F)"
          checkout="$(date -u -d '+3 days' +%F)"
          availability="$(curl --fail --silent --show-error "$base/api/availability?checkin=$checkin&checkout=$checkout")"
          echo "$availability" | jq -e '.ok == true and (.available | type == "number")'
