name: Production smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "api/availability.js"
      - "api/health.js"
      - "tests/availability.test.js"
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Check live website and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://houseofhappinessbangkok.com
    steps:
      - name: Wait for Production deployment
        if: github.event_name == 'push'
        run: sleep 30

      - name: Check homepage
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/")"
          grep --fixed-strings 'id="main"' <<< "$body" > /dev/null

      - name: Check booking page
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/booking.html")"
          grep --fixed-strings 'id="bookingForm"' <<< "$body" > /dev/null

      - name: Check gallery page
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/gallery.html")"
          grep --fixed-strings 'id="glWrap"' <<< "$body" > /dev/null

      - name: Check admin login page
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/admin/")"
          grep --fixed-strings 'id="loginForm"' <<< "$body" > /dev/null

      - name: Check health API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/api/health")"
          echo "$health" | jq -e '(.ok | type == "boolean") and .checks.sheet == "ok"'

      - name: Check availability API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          checkin="$(date -u -d '+2 days' +%F)"
          checkout="$(date -u -d '+3 days' +%F)"
          availability="$(curl --fail --location --silent --show-error --max-time 20 --retry 2 --retry-delay 2 "$BASE_URL/api/availability?checkin=$checkin&checkout=$checkout")"
          echo "$availability" | jq -e '.ok == true and (.available | type == "number")'

      - name: Open or update a production alert
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke test failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "@chawanansuk ระบบตรวจพบว่าเว็บไซต์หรือ API Production มีปัญหา",
              "",
              `เวลา: ${new Date().toISOString()}`,
              `Workflow: ${runUrl}`,
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }

      - name: Close the alert after recovery
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke test failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Production recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
